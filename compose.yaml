services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ORIGIN: https://${DOMAIN:?Bitte DOMAIN in .env setzen}
      SETUP_TOKEN: ${SETUP_TOKEN:?Bitte SETUP_TOKEN in .env setzen}
    volumes:
      - learning_data:/app/data
    expose:
      - "3000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  learning_data:
  caddy_data:
  caddy_config:
