name: Anwendung prüfen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefung:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --ignore-scripts
      - name: Anwendung und Betriebsskripte prüfen
        run: bash scripts/check.sh
      - name: Container bauen
        run: docker build --tag lernreise:pruefung .
      - name: Compose-Konfiguration prüfen
        env:
          DOMAIN: lernen.example.invalid
          SETUP_TOKEN: nur-ein-platzhalter-fuer-die-konfigurationspruefung
        run: |
          docker compose config --quiet
          docker compose -f compose.apache.yaml config --quiet
          test "$(docker compose -f compose.apache.yaml config --services)" = app
